name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Engine conformance + KaTeX render checks
        run: npm test

      - name: Build
        run: npm run build

      - name: examples/ matches the engine
        run: |
          npm run examples
          git diff --exit-code -- examples \
            || (echo "::error::examples/ is stale - run 'npm run examples' and commit the result" && exit 1)
